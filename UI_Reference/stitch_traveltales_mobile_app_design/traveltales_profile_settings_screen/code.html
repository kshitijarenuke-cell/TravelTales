<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TravelTales - Profile / Settings</title>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              teal: '#1B4D3E',
              'teal-dark': '#143B30',
              'teal-light': '#E9F1EF'
            },
            charcoal: '#1E293B',
            muted: '#64748B',
            surface: '#F8FAFC'
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"SF Pro Display"', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
          }
        }
      }
    }
  </script>
<!-- Custom Layout & Component Styles -->
<style data-purpose="custom-layout">
    body {
      background-color: #E2E8F0;
      margin: 0;
      padding: 20px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .device-frame {
      width: 390px;
      height: 844px;
      position: relative;
      background-color: #F8FAFC;
      border-radius: 46px;
      overflow: hidden;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.35), 0 0 0 10px #1E293B;
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body>
<!-- BEGIN: DeviceContainer -->
<main class="device-frame" data-purpose="mobile-screen-wrapper">
<!-- BEGIN: StatusBar -->
<!-- iOS Standard 44px Status Bar -->
<header class="w-full pt-3 px-8 flex justify-between items-center text-xs font-semibold text-slate-800 select-none z-20 shrink-0" data-purpose="ios-status-bar">
<span>9:41</span>
<!-- Speaker notch spacer -->
<div class="w-28 h-4 bg-transparent rounded-full"></div>
<div class="flex items-center space-x-1.5">
<!-- Cellular Signal Icon -->
<svg class="w-4 h-3 text-slate-900 fill-current" viewbox="0 0 17 11">
<rect height="3" rx="0.75" width="3" x="0" y="8"></rect>
<rect height="5.5" rx="0.75" width="3" x="4.5" y="5.5"></rect>
<rect height="8" rx="0.75" width="3" x="9" y="3"></rect>
<rect height="11" rx="0.75" width="3" x="13.5" y="0"></rect>
</svg>
<!-- Wi-Fi Icon -->
<svg class="w-3.5 h-3 text-slate-900 fill-current" viewbox="0 0 16 12">
<path d="M8 12a1.5 1.5 0 100-3 1.5 1.5 0 000 3zm-4.9-3.8c2.7-2.4 7.1-2.4 9.8 0a.7.7 0 001-.9C10.7 4.5 5.3 4.5 2.1 7.3a.7.7 0 001 .9zm-2.8-2.7c4.2-3.8 11.2-3.8 15.4 0a.7.7 0 10.9-1.1C11.7.5 4.3.5.4 4.4a.7.7 0 00.9 1.1z"></path>
</svg>
<!-- Battery Icon -->
<div class="w-5 h-2.5 border border-slate-900 rounded-[3px] p-0.5 flex items-center">
<div class="h-full w-3 bg-slate-900 rounded-sm"></div>
</div>
</div>
</header>
<!-- END: StatusBar -->
<!-- BEGIN: TopAppBar -->
<!-- Screen Header Title -->
<section class="px-6 pt-3 pb-2 flex items-center justify-center relative shrink-0" data-purpose="app-header">
<h1 class="text-[17px] font-bold text-charcoal tracking-tight">Profile</h1>
</section>
<!-- END: TopAppBar -->
<!-- BEGIN: ContentArea -->
<!-- Scrollable content area for user profile card and navigation menu -->
<section class="flex-1 overflow-y-auto px-5 pb-4 space-y-5" data-purpose="profile-body">
<!-- BEGIN: UserProfileCard -->
<!-- Profile Header Area with Avatar, Name, and Email -->
<div class="flex flex-col items-center pt-2 pb-1" data-purpose="user-info-section">
<!-- User Avatar with Border Accent -->
<div class="relative w-20 h-20 rounded-full p-1 bg-white shadow-sm ring-1 ring-slate-200/80 mb-3">
<img alt="Kshitija Renuke Profile Photo" class="w-full h-full object-cover rounded-full" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCg6iO9JH5KeaUN_AB2S15I2kAiICZTerb178k1IJVtjZN-vJ7peV1Z9tdzFrm5z3tdy0oa8Xo1EGQVha-xHdQGFhGLB5-TsKe7um31q5HHAgxVu9WETNo3_1KZcrXAV2vS0hEnWlBCSDqK4QlDDOwv4r2mFvP4BL3ash9pS-OkINw5OHbze__3i42_4cfIQgJtKGgAYgfb74OM--o9AAX7YXtrk8r1o3hJ2tbtun2GlY7ezhIMuYoHfQ"/>
</div>
<!-- User Name -->
<h2 class="text-lg font-bold text-charcoal leading-tight">Kshitija Renuke</h2>
<!-- User Email -->
<p class="text-xs text-muted font-normal mt-0.5">kshitijarenuke@gmail.com</p>
</div>
<!-- END: UserProfileCard -->
<!-- BEGIN: MenuOptionsList -->
<!-- Profile Settings Navigation Menu Items -->
<div class="space-y-2.5 pt-1" data-purpose="menu-options-container">
<!-- Menu Item: My Trips -->
<a class="w-full flex items-center justify-between px-4 py-3.5 bg-white rounded-2xl border border-slate-100 shadow-[0_2px_8px_rgba(0,0,0,0.03)] active:scale-[0.99] transition duration-150" href="#my-trips">
<div class="flex items-center space-x-3.5">
<div class="w-9 h-9 rounded-xl bg-slate-50 flex items-center justify-center text-charcoal">
<!-- Suitcase / Bag Icon -->
<svg class="w-5 h-5 text-slate-700" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
</div>
<span class="text-sm font-semibold text-charcoal">My Trips</span>
</div>
<!-- Trailing Chevron Icon -->
<svg class="w-4 h-4 text-slate-400 stroke-2" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</a>
<!-- Menu Item: Notifications -->
<a class="w-full flex items-center justify-between px-4 py-3.5 bg-white rounded-2xl border border-slate-100 shadow-[0_2px_8px_rgba(0,0,0,0.03)] active:scale-[0.99] transition duration-150" href="#notifications">
<div class="flex items-center space-x-3.5">
<div class="w-9 h-9 rounded-xl bg-slate-50 flex items-center justify-center text-charcoal">
<!-- Bell Icon -->
<svg class="w-5 h-5 text-slate-700" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
</div>
<span class="text-sm font-semibold text-charcoal">Notifications</span>
</div>
<svg class="w-4 h-4 text-slate-400 stroke-2" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</a>
<!-- Menu Item: Help & Support -->
<a class="w-full flex items-center justify-between px-4 py-3.5 bg-white rounded-2xl border border-slate-100 shadow-[0_2px_8px_rgba(0,0,0,0.03)] active:scale-[0.99] transition duration-150" href="#help-support">
<div class="flex items-center space-x-3.5">
<div class="w-9 h-9 rounded-xl bg-slate-50 flex items-center justify-center text-charcoal">
<!-- Help & Support Headset / Info Icon -->
<svg class="w-5 h-5 text-slate-700" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
</div>
<span class="text-sm font-semibold text-charcoal">Help &amp; Support</span>
</div>
<svg class="w-4 h-4 text-slate-400 stroke-2" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</a>
<!-- Menu Item: Settings -->
<a class="w-full flex items-center justify-between px-4 py-3.5 bg-white rounded-2xl border border-slate-100 shadow-[0_2px_8px_rgba(0,0,0,0.03)] active:scale-[0.99] transition duration-150" href="#settings">
<div class="flex items-center space-x-3.5">
<div class="w-9 h-9 rounded-xl bg-slate-50 flex items-center justify-center text-charcoal">
<!-- Cog / Settings Icon -->
<svg class="w-5 h-5 text-slate-700" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
</div>
<span class="text-sm font-semibold text-charcoal">Settings</span>
</div>
<svg class="w-4 h-4 text-slate-400 stroke-2" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</a>
<!-- Menu Item: Logout -->
<a class="w-full flex items-center justify-between px-4 py-3.5 bg-white rounded-2xl border border-slate-100 shadow-[0_2px_8px_rgba(0,0,0,0.03)] active:scale-[0.99] transition duration-150" href="#logout">
<div class="flex items-center space-x-3.5">
<div class="w-9 h-9 rounded-xl bg-slate-50 flex items-center justify-center text-charcoal">
<!-- Exit / Logout Arrow Icon -->
<svg class="w-5 h-5 text-slate-700" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
</div>
<span class="text-sm font-semibold text-charcoal">Logout</span>
</div>
<svg class="w-4 h-4 text-slate-400 stroke-2" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</a>
</div>
<!-- END: MenuOptionsList -->
</section>
<!-- END: ContentArea -->
<!-- BEGIN: BottomNavigation -->
<!-- App Navigation Bar with 5 destinations (TravelTales standard) -->
<nav class="bg-white border-t border-slate-100 px-3 pt-2.5 pb-2 shrink-0 shadow-[0_-4px_12px_rgba(0,0,0,0.03)] z-20" data-purpose="bottom-nav-bar">
<div class="flex justify-around items-center">
<!-- Tab 1: Home -->
<button class="flex flex-col items-center justify-center w-14 text-slate-400 hover:text-brand-teal transition" type="button">
<svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
<span class="text-[10px] font-medium tracking-tight">Home</span>
</button>
<!-- Tab 2: Itinerary -->
<button class="flex flex-col items-center justify-center w-14 text-slate-400 hover:text-brand-teal transition" type="button">
<svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
<span class="text-[10px] font-medium tracking-tight">Itinerary</span>
</button>
<!-- Tab 3: Expenses -->
<button class="flex flex-col items-center justify-center w-14 text-slate-400 hover:text-brand-teal transition" type="button">
<svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
<span class="text-[10px] font-medium tracking-tight">Expenses</span>
</button>
<!-- Tab 4: Guides -->
<button class="flex flex-col items-center justify-center w-14 text-slate-400 hover:text-brand-teal transition" type="button">
<svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
<span class="text-[10px] font-medium tracking-tight">Guides</span>
</button>
<!-- Tab 5: Maps (Active context / Navigation item) -->
<button class="flex flex-col items-center justify-center w-14 text-brand-teal" type="button">
<svg class="w-5 h-5 mb-0.5 text-brand-teal" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="text-[10px] font-bold text-brand-teal tracking-tight">Maps</span>
</button>
</div>
<!-- BEGIN: HomeIndicator -->
<!-- Standard iOS Home Bar -->
<div class="w-full flex justify-center pt-3 pb-1" data-purpose="home-indicator">
<div class="w-32 h-1 bg-slate-900 rounded-full"></div>
</div>
<!-- END: HomeIndicator -->
</nav>
<!-- END: BottomNavigation -->
</main>
<!-- END: DeviceContainer -->
</body></html>
