<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TravelTales - Empty State (Expenses)</title>
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              teal: '#1B4D3E',
              'teal-dark': '#13392D',
              'teal-light': '#E9F1EE',
            },
            canvas: '#F9FAF9'
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style data-purpose="base-styling">
    body {
      background-color: #E2E8F0;
      margin: 0;
      padding: 20px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    /* Fixed iOS Device Viewport */
    .mobile-screen {
      width: 390px;
      height: 844px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }
  </style>
</head>
<body>
<!-- BEGIN: MobileDeviceFrame -->
<div class="mobile-screen bg-[#F9FAF9] flex flex-col justify-between select-none rounded-[48px] border-[6px] border-slate-900">
<!-- BEGIN: TopSectionWrapper -->
<div class="w-full flex flex-col shrink-0">
<!-- BEGIN: StatusBar -->
<!-- iOS standard 44px status bar with time, cellular, wifi, and battery -->
<header class="w-full h-11 pt-3 px-7 flex justify-between items-center text-slate-900 text-xs font-semibold z-20" data-purpose="status-bar">
<!-- Time -->
<span class="tracking-tight text-[15px] font-semibold">9:41</span>
<!-- Status Icons -->
<div aria-label="System status" class="flex items-center space-x-1.5">
<!-- Cellular Signal -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 17 12">
<rect height="3.5" rx="0.7" width="2.8" x="0" y="8.5"></rect>
<rect height="6" rx="0.7" width="2.8" x="4.5" y="6"></rect>
<rect height="9" rx="0.7" width="2.8" x="9" y="3"></rect>
<rect height="12" rx="0.7" width="2.8" x="13.5" y="0"></rect>
</svg>
<!-- Wi-Fi -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 16 12">
<path clip-rule="evenodd" d="M8 2.5C5.1 2.5 2.5 3.7 0.7 5.6C0.4 5.9 0.4 6.4 0.7 6.7L7.4 13.4C7.7 13.7 8.3 13.7 8.6 13.4L15.3 6.7C15.6 6.4 15.6 5.9 15.3 5.6C13.5 3.7 10.9 2.5 8 2.5ZM2.1 6.9C3.6 5.4 5.7 4.5 8 4.5C10.3 4.5 12.4 5.4 13.9 6.9L8 12.8L2.1 6.9Z" fill-rule="evenodd"></path>
</svg>
<!-- Battery -->
<div class="w-6 h-3 rounded-[4px] border border-slate-900 p-0.5 flex items-center relative">
<div class="h-full w-4 bg-slate-900 rounded-[2px]"></div>
<div class="w-0.5 h-1 bg-slate-900 rounded-r-sm absolute -right-1 top-1"></div>
</div>
</div>
</header>
<!-- END: StatusBar -->
<!-- BEGIN: NavigationBar -->
<nav class="w-full px-5 py-3 flex items-center justify-between" data-purpose="app-bar">
<!-- Back Navigation Button -->
<button aria-label="Go back" class="p-1.5 -ml-1.5 text-slate-800 hover:text-slate-600 transition-colors" type="button">
<svg class="w-6 h-6 stroke-current stroke-2 fill-none stroke-linecap-round stroke-linejoin-round" viewbox="0 0 24 24">
<path d="M15 18l-6-6 6-6"></path>
</svg>
</button>
<!-- Screen Title -->
<h1 class="text-base font-semibold text-slate-900 pr-4">Expenses</h1>
<!-- Placeholder to balance flex layout -->
<div aria-hidden="true" class="w-6 h-6"></div>
</nav>
<!-- END: NavigationBar -->
</div>
<!-- END: TopSectionWrapper -->
<!-- BEGIN: EmptyStateContent -->
<main class="flex-1 flex flex-col items-center justify-center px-8 -mt-12" data-purpose="empty-state-view">
<!-- Backpack Illustration Container -->
<div class="w-24 h-24 mb-6 flex items-center justify-center text-brand-teal" data-purpose="illustration">
<svg class="w-20 h-20" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 72 72">
<!-- Top Carry Handle -->
<path d="M30 18V12C30 9.79086 31.7909 8 34 8H38C40.2091 8 42 9.79086 42 12V18"></path>
<!-- Main Backpack Shell -->
<path d="M22 23C22 19.6863 24.6863 17 28 17H44C47.3137 17 50 19.6863 50 23V56C50 60.4183 46.4183 64 42 64H30C25.5817 64 22 60.4183 22 56V23Z"></path>
<!-- Front Pocket -->
<path d="M28 36H44C46.2091 36 48 37.7909 48 40V54C48 57.3137 45.3137 60 42 60H30C26.6863 60 24 57.3137 24 54V40C24 37.7909 25.7909 36 28 36Z"></path>
<!-- Pocket Zipper Line -->
<line x1="28" x2="44" y1="42" y2="42"></line>
<!-- Left Side Pocket / Bottle Holder -->
<path d="M22 38H18C16.8954 38 16 38.8954 16 40V50C16 51.1046 16.8954 52 18 52H22"></path>
<!-- Right Side Pocket / Bottle Holder -->
<path d="M50 38H54C55.1046 38 56 38.8954 56 40V50C56 51.1046 55.1046 52 54 52H50"></path>
<!-- Shoulder Strap Attachment Detail -->
<path d="M33 25H39"></path>
</svg>
</div>
<!-- Empty State Title -->
<h2 class="text-xl font-bold text-slate-800 tracking-tight mb-2 text-center">
        No expenses yet!
      </h2>
<!-- Empty State Description -->
<p class="text-sm text-slate-500 text-center leading-relaxed max-w-[220px] mb-8 font-normal">
        Start tracking your expenses to stay within budget.
      </p>
<!-- Action Button -->
<button class="w-full max-w-[200px] py-3.5 px-6 bg-brand-teal hover:bg-brand-teal-dark active:scale-[0.98] text-white text-sm font-semibold rounded-xl shadow-sm transition-all duration-150 flex items-center justify-center" data-purpose="add-expense-cta" type="button">
        Add Expense
      </button>
</main>
<!-- END: EmptyStateContent -->
<!-- BEGIN: HomeIndicator -->
<!-- Standard iOS Bottom Indicator Bar -->
<footer class="w-full h-8 flex justify-center items-center pb-2 shrink-0" data-purpose="home-indicator">
<div class="w-36 h-1 bg-slate-800 rounded-full"></div>
</footer>
<!-- END: HomeIndicator -->
</div>
<!-- END: MobileDeviceFrame -->
</body></html>
