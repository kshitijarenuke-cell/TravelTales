<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TravelTales - Maps Screen</title>
<!-- Tailwind CSS CDN with forms and container queries plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'teal-brand': '#1B4D3E',
            'teal-brand-hover': '#163f33',
            'sand-light': '#F8F9FA',
            'map-water': '#BAE6FD',
            'map-land': '#D8EED8',
            'map-contour': '#C5E3C5',
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style data-purpose="custom-layout">
    /* Device frame constraints */
    .mobile-screen {
      width: 390px;
      height: 844px;
      max-width: 100vw;
      max-height: 100vh;
    }
    /* Map visual styling */
    .map-canvas-container {
      background: radial-gradient(circle at 60% 40%, #E8F5E9 0%, #E1EFE1 35%, #BAE6FD 75%, #A5DBF8 100%);
    }
    .custom-shadow-float {
      box-shadow: 0 8px 24px -4px rgba(27, 77, 62, 0.15), 0 2px 8px -2px rgba(0, 0, 0, 0.08);
    }
    .marker-pulse {
      animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }
    @keyframes pulse-ring {
      0% {
        transform: scale(0.9);
        opacity: 0.8;
      }
      50% {
        transform: scale(1.3);
        opacity: 0.2;
      }
      100% {
        transform: scale(0.9);
        opacity: 0.8;
      }
    }
  </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-0 m-0 overflow-hidden font-sans select-none antialiased">
<!-- BEGIN: MobileDeviceContainer -->
<main class="mobile-screen relative bg-white shadow-2xl overflow-hidden flex flex-col justify-between" data-purpose="mobile-viewport">
<!-- BEGIN: MapBackgroundArea -->
<div class="absolute inset-0 z-0 map-canvas-container overflow-hidden" data-purpose="interactive-map-area">
<!-- Illustrated Island Landmass SVG overlay -->
<svg class="absolute inset-0 w-full h-full object-cover pointer-events-none" fill="none" viewbox="0 0 390 844" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient gradientunits="userSpaceOnUse" id="islandGrad" x1="50" x2="350" y1="120" y2="600">
<stop offset="0%" stop-color="#E7F6E7"></stop>
<stop offset="60%" stop-color="#DAEFDB"></stop>
<stop offset="100%" stop-color="#CBE8CE"></stop>
</lineargradient>
<filter filterunits="userSpaceOnUse" height="860" id="islandShadow" width="410" x="-10" y="-10">
<fedropshadow dx="0" dy="6" flood-color="#0284C7" flood-opacity="0.18" stddeviation="10"></fedropshadow>
</filter>
</defs>
<!-- Coastal ocean contour layers -->
<path d="M 60,180 C 130,140 280,120 360,200 C 410,260 380,450 330,550 C 270,660 170,680 90,590 C 20,490 20,380 40,290 Z" fill="#9DD7F7" opacity="0.3"></path>
<path d="M 75,195 C 140,155 270,135 345,210 C 390,270 365,440 320,535 C 265,640 175,660 100,575 C 35,480 35,375 55,300 Z" fill="#C5EBF9" opacity="0.5"></path>
<!-- Main Bali Land Shape -->
<path d="M 90,210 C 150,170 260,150 330,220 C 375,280 350,430 305,520 C 255,620 170,640 105,560 C 45,470 50,370 70,300 Z" fill="url(#islandGrad)" filter="url(#islandShadow)" stroke="#B3DCB5" stroke-width="2"></path>
<!-- Secondary Peninsula / Bukit Peninsula Shape (Uluwatu Area) -->
<path d="M 120,540 C 145,530 185,550 175,615 C 168,660 115,675 88,640 C 65,605 90,555 120,540 Z" fill="url(#islandGrad)" stroke="#B3DCB5" stroke-width="2"></path>
<!-- Interior Elevation / Forest Zones -->
<path d="M 160,240 C 210,210 280,220 295,280 C 310,340 260,400 210,380 C 160,360 130,280 160,240 Z" fill="#CBE7CC" opacity="0.75"></path>
<path d="M 180,260 C 220,235 260,250 270,290 C 280,330 235,360 205,345 C 170,330 155,285 180,260 Z" fill="#BADFBC" opacity="0.8"></path>
<!-- Island Main Roads Network -->
<path d="M 85,610 Q 140,560 180,480 T 220,330 T 260,220" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"></path>
<path d="M 85,610 Q 140,560 180,480 T 220,330 T 260,220" fill="none" stroke="#FDE68A" stroke-dasharray="4 2" stroke-linecap="round" stroke-width="1.8"></path>
<path d="M 180,480 Q 260,490 320,440" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-width="2.5"></path>
<path d="M 140,360 Q 210,390 275,340" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-width="2"></path>
<path d="M 110,280 Q 170,260 230,280" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-width="2"></path>
<!-- Geographic Label -->
<text fill="#4B6A56" font-size="14" font-weight="700" letter-spacing="1.5" opacity="0.6" x="260" y="375">Bali</text>
<text fill="#587A65" font-size="10" font-weight="600" opacity="0.45" x="210" y="495">DENPASAR</text>
<circle cx="205" cy="492" fill="#587A65" opacity="0.6" r="2"></circle>
</svg>
<!-- Pin Marker for Uluwatu Temple -->
<div class="absolute left-[78px] top-[430px] flex flex-col items-center cursor-pointer group" data-purpose="map-pin-marker">
<!-- Floating Marker Label Badge -->
<div class="bg-white px-3 py-1.5 rounded-xl shadow-lg border border-gray-100 flex items-center gap-2 transform -translate-y-1 transition hover:scale-105">
<div class="w-6 h-6 rounded-md overflow-hidden bg-teal-brand/10 flex-shrink-0">
<img alt="Uluwatu mini" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCh_MGxvb3DzqZdjfCt2wVU7_JBmFWUDJ_nHbafYueQ27VSVayYU6nXvPi0rlWgmCI95L25T4SQHbxJz-tWbOJ5jLwXKFV2vW5N3L8bsz1FHLo8CiGpibHwX4VtNaLvneVf7Ptk7hcfdXNci8iyZP8hrgo5FgteHp41fltqt10xMYh_iVBZjzSdNoAgWyXBzkypZt5IegZcS0YyQYxiSeArRMU1fl5hpHEcW-ffvZuBiVo6Nzyk7cku5Q"/>
</div>
<div class="flex flex-col">
<span class="text-xs font-bold text-gray-800 leading-tight">Uluwatu Temple</span>
<div class="flex items-center gap-1">
<span class="text-[10px] text-amber-500">★</span>
<span class="text-[10px] font-semibold text-gray-700">4.8</span>
<span class="text-[9px] text-gray-400">(1.2k)</span>
</div>
</div>
</div>
<!-- Custom Pointer Pin -->
<div class="relative flex items-center justify-center -mt-0.5">
<div class="w-6 h-6 bg-teal-brand rounded-full border-2 border-white shadow-md flex items-center justify-center z-10">
<div class="w-2 h-2 bg-white rounded-full"></div>
</div>
<!-- Pulse ring on active location -->
<div class="absolute w-8 h-8 rounded-full bg-teal-brand/30 marker-pulse"></div>
<!-- Little arrow at bottom of pin -->
<div class="absolute -bottom-1.5 w-2 h-2 bg-teal-brand rotate-45 border-r border-b border-teal-brand"></div>
</div>
</div>
</div>
<!-- END: MapBackgroundArea -->
<!-- BEGIN: TopHeaderSection -->
<header class="relative z-10 pt-3 px-5 flex flex-col gap-3" data-purpose="top-navigation-header">
<!-- iOS Status Bar -->
<div class="flex items-center justify-between text-gray-900 font-semibold text-[14px] tracking-tight pt-1">
<span>9:41</span>
<div class="flex items-center space-x-2">
<!-- Cellular Icon -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 17 12">
<rect height="4" rx="0.8" width="3" x="0" y="8"></rect>
<rect height="6.5" rx="0.8" width="3" x="4.5" y="5.5"></rect>
<rect height="9" rx="0.8" width="3" x="9" y="3"></rect>
<rect height="12" rx="0.8" width="3" x="13.5" y="0"></rect>
</svg>
<!-- Wifi Icon -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.5c3.6 0 6.9 1.3 9.4 3.5L12 19.3 2.6 11C5.1 8.8 8.4 7.5 12 7.5z"></path>
</svg>
<!-- Battery Icon -->
<div class="w-6 h-3 border border-gray-900 rounded-sm p-0.5 flex items-center">
<div class="h-full bg-gray-900 w-full rounded-2xs"></div>
</div>
</div>
</div>
<!-- Header Bar: Back Chevron, Title, and Action -->
<div class="flex items-center justify-between mt-1">
<button aria-label="Go back" class="w-9 h-9 rounded-full bg-white/90 backdrop-blur-sm border border-gray-100 flex items-center justify-center text-gray-700 shadow-sm active:scale-95 transition" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"></path>
</svg>
</button>
<h1 class="text-base font-bold text-gray-900 tracking-tight">Maps</h1>
<button aria-label="Close or options" class="w-9 h-9 rounded-full bg-white/90 backdrop-blur-sm border border-gray-100 flex items-center justify-center text-gray-700 shadow-sm active:scale-95 transition" type="button">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
<!-- Search Location Input Pill -->
<div class="relative w-full" data-purpose="search-box">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"></path>
</svg>
</div>
<input class="w-full bg-white/95 backdrop-blur-md text-gray-700 text-sm font-medium pl-10 pr-4 py-2.5 rounded-full shadow-md border-0 ring-1 ring-black/5 focus:outline-none focus:ring-2 focus:ring-teal-brand placeholder-gray-400 cursor-pointer" readonly="" type="text" value="Search location..."/>
</div>
</header>
<!-- END: TopHeaderSection -->
<!-- BEGIN: FloatingControlButtons -->
<div class="absolute right-5 bottom-[240px] z-10 flex flex-col space-y-3" data-purpose="map-floating-controls">
<!-- Recenter / Navigation Compass Button -->
<button aria-label="Current location" class="w-11 h-11 bg-white rounded-full shadow-lg border border-gray-100 flex items-center justify-center text-teal-brand active:scale-95 transition" type="button">
<svg class="w-5 h-5 transform -rotate-45" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<!-- Map Layers Button -->
<button aria-label="Map layers" class="w-11 h-11 bg-white rounded-full shadow-lg border border-gray-100 flex items-center justify-center text-gray-600 active:scale-95 transition" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
<!-- END: FloatingControlButtons -->
<!-- BEGIN: BottomSheetPreviewCard -->
<section class="relative z-20 px-4 pb-2" data-purpose="place-preview-card">
<div class="bg-white rounded-2xl p-4 custom-shadow-float border border-gray-100/80 flex flex-col gap-3.5">
<!-- Top Half: Image & Details -->
<div class="flex items-start gap-3.5">
<!-- Thumbnail Image -->
<div class="w-16 h-16 rounded-xl overflow-hidden flex-shrink-0 bg-gray-100 shadow-inner">
<img alt="Uluwatu Temple Cliff" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBgiU_a4XIkVoRpY97cGBKVf940fS64GxOCxAoPMb-gKsDwfGkJZrqliz5iwioSKyeAY2wPAdgp5wAGtMPYVoNVDZHWAVptMNHu4X5pbuiskMbswwfeZJCENmxNK8kywHhyqqnVqt0skYKftdm6LSbydkc-nS-VDuo_79oRuMbRg0pQEMkjKTtCAPSAhEnePJnCd46bjbXrrqL6d5h34YHa96lks8qRYy0I8Vhp7GSQTy6yVC3cGjORGA"/>
</div>
<!-- Text Details -->
<div class="flex-1 min-w-0">
<div class="flex items-center justify-between">
<h2 class="text-base font-bold text-gray-900 truncate">Uluwatu Temple</h2>
<button aria-label="More information" class="text-gray-400 hover:text-gray-600" type="button">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
</svg>
</button>
</div>
<!-- Rating badge -->
<div class="flex items-center gap-1.5 mt-0.5">
<div class="flex items-center text-amber-500">
<span class="text-xs">★</span>
<span class="text-xs font-bold text-gray-800 ml-1">4.8</span>
</div>
<span class="text-xs text-gray-400">(1.2k reviews)</span>
</div>
<!-- Distance and Duration Info -->
<div class="flex items-center gap-3 mt-1 text-[11px] text-gray-500">
<span class="flex items-center gap-1">
<svg class="w-3 h-3 text-teal-brand" fill="currentColor" viewbox="0 0 20 20">
<path clip-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" fill-rule="evenodd"></path>
</svg>
                2.1 km
              </span>
<span class="flex items-center gap-1">
<svg class="w-3 h-3 text-gray-400" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
                25 min
              </span>
</div>
</div>
</div>
<!-- Action Button -->
<button class="w-full bg-teal-brand hover:bg-teal-brand-hover text-white text-xs font-semibold py-3 px-4 rounded-xl shadow-md transition active:scale-[0.99] flex items-center justify-center tracking-wide" type="button">
          View Details
        </button>
</div>
<!-- iOS Home Indicator -->
<div class="w-full flex justify-center py-2">
<div class="w-32 h-1 bg-gray-400/80 rounded-full"></div>
</div>
</section>
<!-- END: BottomSheetPreviewCard -->
</main>
<!-- END: MobileDeviceContainer -->
</body></html>
