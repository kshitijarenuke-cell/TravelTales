<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>TravelTales - Itinerary</title>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration for TravelTales Theme -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            travel: {
              teal: '#1B4D3E',
              'teal-dark': '#143C30',
              'teal-light': '#E9F1EE',
              bg: '#F9FBFB',
              card: '#FFFFFF',
              dark: '#111827',
              gray: '#6B7280',
              'border-subtle': '#E5E7EB'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"SF Pro Display"', 'Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
<!-- Typography & Layout Overrides -->
<style data-purpose="custom-styling">
    /* Hide scrollbars for pill tabs */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-0 sm:p-4 text-slate-800 antialiased font-sans select-none">
<!-- BEGIN: MobileContainer -->
<!-- iPhone 13/14/15 dimensions: 390px x 844px -->
<div class="w-full max-w-[390px] h-[844px] bg-[#FAFCFB] flex flex-col justify-between shadow-2xl relative overflow-hidden sm:rounded-[44px] border border-slate-200/80">
<!-- BEGIN: TopStatusBar -->
<header class="pt-3 px-7 pb-2 flex justify-between items-center z-20 shrink-0">

<span class="text-[15px] font-semibold tracking-tight text-travel-dark">9:41</span>

<div class="flex items-center space-x-1.5 text-travel-dark">

</svg>

<path clip-rule="evenodd" d="M10 3c-4.22 0-8.08 1.63-11 4.31l1.41 1.41C2.86 6.36 6.22 5 10 5s7.14 1.36 9.59 3.72l1.41-1.41C18.08 4.63 14.22 3 10 3zm-6.7 6.31 1.41 1.41C6.12 9.57 7.97 9 10 9s3.88.57 5.29 1.72l1.41-1.41A9.97 9.97 0 0 0 10 7c-2.48 0-4.78.89-6.7 2.31zm3.3 3.3 1.41 1.41C8.6 13.62 9.27 13.5 10 13.5s1.4.12 1.99.52l1.41-1.41A5.992 5.992 0 0 0 10 11.5c-1.28 0-2.47.4-3.4 1.11zM10 16a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z" fill-rule="evenodd"></path>
</svg>
<!-- Battery -->
<div class="w-5 h-2.5 border border-travel-dark rounded-[3px] p-0.5 flex items-center">
<div class="h-full w-3 bg-travel-dark rounded-[1px]"></div>
</div>
</div>
</header>
<!-- END: TopStatusBar -->
<!-- BEGIN: NavigationBar -->

<svg class="w-5 h-5 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"></path>

</button>

<span class="text-[11px] text-gray-400 mt-1 font-normal leading-none">13 Apr</span>

<div class="w-[46px] pt-[2px] text-right font-medium text-[13px] text-gray-600">
              19:00

<div class="relative flex items-center justify-center mt-1">
<span class="w-[10px] h-[10px] rounded-full bg-travel-teal ring-4 ring-[#FAFCFB]"></span>
</div>
<!-- Item Details -->
<div class="flex-1 -mt-0.5">
<h2 class="text-[14px] font-semibold text-travel-dark leading-snug">Dinner</h2>
<p class="text-[12px] text-gray-400 mt-0.5 font-normal">The Loft</p>

</section>

<div class="pt-4 pb-2 px-2 flex justify-center shrink-0">
<button class="w-full max-w-[280px] h-[44px] bg-travel-teal hover:bg-travel-teal-dark active:scale-[0.98] transition-all text-white font-medium text-[14px] rounded-full flex items-center justify-center space-x-1.5 shadow-md shadow-travel-teal/20" type="button">
<svg class="w-4 h-4 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 4.5v15m7.5-7.5h-15" stroke-linecap="round" stroke-linejoin="round"></path>
