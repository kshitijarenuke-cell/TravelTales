<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>TravelTales - Filter Guides</title>
<!-- Tailwind CSS CDN with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              teal: '#1B4D3E',
              'teal-dark': '#143B2F',
              'teal-light': '#E9F1EF'
            },
            surface: {
              base: '#F8FAFC',
              card: '#FFFFFF',
              border: '#E2E8F0',
              input: '#F1F5F9'
            },
            content: {
              primary: '#1E293B',
              secondary: '#64748B',
              muted: '#94A3B8'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', '"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
          }
        }
      }
    };
  </script>
<!-- Layout and Device Constraints -->
<style data-purpose="device-layout">
    body {
      background-color: #0F172A;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .mobile-screen {
      width: 390px;
      height: 844px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background-color: #F8FAFC;
      border-radius: 44px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.4), 0 0 0 10px #1E293B;
    }
    /* Hide scrollbars for pill chips container */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body>
<!-- BEGIN: MobileDeviceScreen -->
<div class="mobile-screen" data-purpose="mobile-viewport">
<!-- BEGIN: StatusBar -->
<header class="w-full pt-3 px-7 flex justify-between items-center z-20 shrink-0 text-slate-800" data-purpose="ios-status-bar">
<!-- Time Display -->
<span class="text-[15px] font-semibold tracking-tight text-slate-900" id="status-bar-clock">9:41</span>
<!-- System Icons: Cellular, Wi-Fi, Battery -->
<div aria-label="Device Status" class="flex items-center space-x-2 text-slate-900">
<!-- Cellular Signal Icon -->
<svg aria-hidden="true" class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.9-1.9C9.22 19.98 10.56 21 12 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 2c3.87 0 7 3.13 7 7 0 1.4-.41 2.7-1.12 3.8l-9.68-9.68C9.3 5.41 10.6 5 12 5z" opacity="0.3"></path>
<path d="M2 18h3v3H2zM7 14h3v7H7zM12 10h3v11h-3zM17 6h3v15h-3z"></path>
</svg>
<!-- Wi-Fi Icon -->
<svg aria-hidden="true" class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98A16.88 16.88 0 0012 4zm0 2.9c3.7 0 7.07 1.43 9.61 3.79L12 19.4 2.39 10.69A14.9 14.9 0 0112 6.9z"></path>
</svg>
<!-- Battery Icon -->
<div class="flex items-center">
<div class="w-6 h-3 rounded-[4px] border border-slate-900 p-[1.5px] flex items-center">
<div class="w-4 h-full bg-slate-900 rounded-[2px]"></div>
</div>
<div class="w-[2px] h-[5px] bg-slate-900 rounded-r-sm -ml-[0.5px]"></div>
</div>
</div>
</header>
<!-- END: StatusBar -->
<!-- BEGIN: TopAppBar -->
<nav class="w-full px-5 py-3 flex items-center border-b border-slate-100 bg-surface-base shrink-0" data-purpose="navigation-header">
<!-- Back Navigation Button -->
<button aria-label="Go back" class="w-10 h-10 -ml-2 rounded-full flex items-center justify-center text-slate-700 active:bg-slate-200 transition-colors" type="button">
<svg class="w-5 h-5 text-slate-800" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- App Bar Title -->
<h1 class="text-xl font-bold text-content-primary tracking-tight ml-2">Filter Guides</h1>
</nav>
<!-- END: TopAppBar -->
<!-- BEGIN: MainFilterContent -->
<main class="flex-1 overflow-y-auto px-6 py-5 space-y-7" data-purpose="filter-options-container">
<!-- SECTION 1: Category Selection -->
<section data-purpose="category-filter-section">
<h2 class="text-base font-bold text-content-primary mb-3.5 tracking-tight">Category</h2>
<!-- Filter Chips Row -->
<div aria-label="Guide Categories" class="flex items-center space-x-2.5 overflow-x-auto no-scrollbar py-0.5" role="group">
<!-- Active Filter Pill: All -->
<button aria-pressed="true" class="px-5 py-2.5 rounded-full bg-brand-teal text-white text-sm font-semibold shadow-sm transition-transform active:scale-95 shrink-0" type="button">
            All
          </button>
<!-- Inactive Filter Pill: Food -->
<button aria-pressed="false" class="px-5 py-2.5 rounded-full bg-[#EBF0F2] text-[#475569] text-sm font-medium hover:bg-slate-200 transition-all shrink-0 active:scale-95" type="button">
            Food
          </button>
<!-- Inactive Filter Pill: Culture -->
<button aria-pressed="false" class="px-5 py-2.5 rounded-full bg-[#EBF0F2] text-[#475569] text-sm font-medium hover:bg-slate-200 transition-all shrink-0 active:scale-95" type="button">
            Culture
          </button>
<!-- Inactive Filter Pill: Adventure -->
<button aria-pressed="false" class="px-5 py-2.5 rounded-full bg-[#EBF0F2] text-[#475569] text-sm font-medium hover:bg-slate-200 transition-all shrink-0 active:scale-95" type="button">
            Adventure
          </button>
<!-- Inactive Filter Pill: Nature -->
<button aria-pressed="false" class="px-5 py-2.5 rounded-full bg-[#EBF0F2] text-[#475569] text-sm font-medium hover:bg-slate-200 transition-all shrink-0 active:scale-95" type="button">
            Nature
          </button>
</div>
</section>
<!-- SECTION 2: Price Range Filter -->
<section class="pt-1" data-purpose="price-filter-section">
<!-- Section Header -->
<h2 class="text-base font-bold text-content-primary mb-3 tracking-tight">Price Range</h2>
<!-- Price Range Control Container -->
<div class="bg-white p-5 rounded-2xl border border-surface-border shadow-[0_2px_8px_rgba(0,0,0,0.03)]">
<!-- Price Badge Values -->
<div class="flex justify-between items-center mb-6">
<div class="flex items-center space-x-1">
<span class="text-xs font-medium text-content-secondary">Min:</span>
<span class="text-sm font-bold text-brand-teal bg-teal-50 px-2.5 py-1 rounded-md border border-teal-100/60">₹ 500</span>
</div>
<div class="flex items-center space-x-1">
<span class="text-xs font-medium text-content-secondary">Max:</span>
<span class="text-sm font-bold text-brand-teal bg-teal-50 px-2.5 py-1 rounded-md border border-teal-100/60">₹ 5,000</span>
</div>
</div>
<!-- Dual Slider Mockup matching Material 3 Design -->
<div class="relative w-full h-8 flex items-center px-1" data-purpose="range-slider-control">
<!-- Background Full Track -->
<div class="w-full h-1.5 bg-slate-200 rounded-full absolute"></div>
<!-- Active Teal Selected Track -->
<div class="absolute left-[15%] right-[20%] h-2 bg-brand-teal rounded-full z-0"></div>
<!-- Left Drag Handle / Thumb -->
<div aria-label="Minimum Price" aria-valuemax="5000" aria-valuemin="500" aria-valuenow="500" class="absolute left-[15%] -translate-x-1/2 w-6 h-6 bg-white border-[3px] border-brand-teal rounded-full shadow-md cursor-pointer hover:scale-105 active:scale-95 transition-transform z-10" role="slider"></div>
<!-- Right Drag Handle / Thumb -->
<div aria-label="Maximum Price" aria-valuemax="5000" aria-valuemin="500" aria-valuenow="4000" class="absolute right-[20%] translate-x-1/2 w-6 h-6 bg-white border-[3px] border-brand-teal rounded-full shadow-md cursor-pointer hover:scale-105 active:scale-95 transition-transform z-10" role="slider"></div>
</div>
<!-- Subtle Scale Labels below track -->
<div class="flex justify-between items-center text-[11px] font-medium text-slate-400 mt-2 px-1">
<span>₹ 0</span>
<span>₹ 2,500</span>
<span>₹ 5,000+</span>
</div>
</div>
</section>
<!-- SECTION 3: Rating Filter -->
<section class="pt-1" data-purpose="rating-filter-section">
<!-- Section Header -->
<h2 class="text-base font-bold text-content-primary mb-3 tracking-tight">Rating</h2>
<!-- Interactive Rating Card Row matching Screen 23 -->
<button aria-label="Select minimum rating, currently 4 stars and above" class="w-full bg-white px-5 py-4 rounded-2xl border border-surface-border shadow-[0_2px_8px_rgba(0,0,0,0.03)] flex items-center justify-between active:bg-slate-50 transition-colors text-left" type="button">
<!-- Stars Display -->
<div class="flex items-center space-x-1.5">
<!-- Star 1 (Filled) -->
<svg class="w-5 h-5 text-amber-400 fill-current" viewbox="0 0 20 20">
<path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path>
</svg>
<!-- Star 2 (Filled) -->
<svg class="w-5 h-5 text-amber-400 fill-current" viewbox="0 0 20 20">
<path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path>
</svg>
<!-- Star 3 (Filled) -->
<svg class="w-5 h-5 text-amber-400 fill-current" viewbox="0 0 20 20">
<path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path>
</svg>
<!-- Star 4 (Filled) -->
<svg class="w-5 h-5 text-amber-400 fill-current" viewbox="0 0 20 20">
<path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path>
</svg>
<!-- Star 5 (Unfilled / Slate) -->
<svg class="w-5 h-5 text-slate-300 fill-current" viewbox="0 0 20 20">
<path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path>
</svg>
</div>
<!-- Value Label and Chevron Navigation -->
<div class="flex items-center space-x-2">
<span class="text-sm font-semibold text-content-primary">4+</span>
<svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</button>
</section>
</main>
<!-- END: MainFilterContent -->
<!-- BEGIN: BottomActionSection -->
<footer class="w-full bg-white px-6 pt-4 pb-2 border-t border-slate-100 shadow-[0_-4px_16px_rgba(0,0,0,0.04)] shrink-0" data-purpose="action-buttons-group">
<!-- Buttons Row -->
<div class="flex items-center space-x-3 w-full mb-3">
<!-- Apply Filters Primary Button -->
<button class="flex-1 py-3.5 px-6 rounded-xl bg-brand-teal hover:bg-brand-teal-dark active:scale-[0.98] transition-all text-white text-base font-semibold text-center shadow-sm flex justify-center items-center" type="button">
          Apply Filters
        </button>
<!-- Clear All Secondary Button -->
<button class="py-3.5 px-5 rounded-xl text-content-secondary hover:text-slate-800 hover:bg-slate-100 active:scale-[0.98] transition-all text-base font-semibold text-center border border-surface-border bg-surface-base" type="button">
          Clear All
        </button>
</div>
<!-- BEGIN: HomeIndicator -->
<div class="w-full flex justify-center items-center pb-2 pt-1" data-purpose="ios-home-indicator">
<div class="w-32 h-1 bg-slate-900 rounded-full opacity-80"></div>
</div>
<!-- END: HomeIndicator -->
</footer>
<!-- END: BottomActionSection -->
</div>
<!-- END: MobileDeviceScreen -->
</body></html>
