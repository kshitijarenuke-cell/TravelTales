<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TravelTales - Add Activity</title>
<!-- Tailwind CSS CDN with forms and container queries plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              teal: '#1B4D3E',
              'teal-dark': '#153D31',
              'teal-light': '#E8F1EE'
            },
            neutral: {
              50: '#F9FAFB',
              100: '#F3F4F6',
              200: '#E5E7EB',
              300: '#D1D5DB',
              400: '#9CA3AF',
              500: '#6B7280',
              600: '#4B5563',
              700: '#374151',
              800: '#1F2937',
              900: '#111827',
            }
          }
        }
      }
    }
  </script>
<style data-purpose="custom-layout">
    /* Strict Mobile Viewport Container */
    body {
      background-color: #ECEFF1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    
    .mobile-screen {
      width: 390px;
      height: 844px;
      position: relative;
      background-color: #FFFFFF;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
      border-radius: 44px;
    }

    /* Custom outline remove & soft transitions */
    input:focus, select:focus {
      outline: none !important;
      box-shadow: 0 0 0 1.5px #1B4D3E !important;
      border-color: #1B4D3E !important;
    }
  </style>
</head>
<body>
<!-- BEGIN: MobileDeviceFrame -->
<main class="mobile-screen flex flex-col justify-between select-none" data-purpose="add-activity-screen">
<!-- BEGIN: TopBarSection -->
<header class="w-full pt-3 px-6 pb-2" data-purpose="screen-header">
<!-- iOS Status Bar -->
<div class="flex justify-between items-center h-8 text-[15px] font-semibold text-neutral-900 tracking-tight" data-purpose="status-bar">
<span>9:41</span>
<div class="flex items-center space-x-1.5">
<!-- Cellular Signal Icon -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 18 14">
<rect height="4" rx="0.5" width="2.5" x="0.5" y="10"></rect>
<rect height="7" rx="0.5" width="2.5" x="4.5" y="7"></rect>
<rect height="10" rx="0.5" width="2.5" x="8.5" y="4"></rect>
<rect height="13" rx="0.5" width="2.5" x="12.5" y="1"></rect>
</svg>
<!-- Wi-Fi Icon -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 16 12">
<path d="M8 2.5C10.4 2.5 12.6 3.4 14.2 4.9L15.6 3.5C13.6 1.7 11 0.6 8 0.6C5 0.6 2.4 1.7 0.4 3.5L1.8 4.9C3.4 3.4 5.6 2.5 8 2.5ZM8 6C9.5 6 10.9 6.6 11.9 7.6L13.3 6.2C11.9 4.9 10.1 4.1 8 4.1C5.9 4.1 4.1 4.9 2.7 6.2L4.1 7.6C5.1 6.6 6.5 6 8 6ZM8 9.5C8.9 9.5 9.7 9.8 10.3 10.4L8 12.7L5.7 10.4C6.3 9.8 7.1 9.5 8 9.5Z"></path>
</svg>
<!-- Battery Icon -->
<div class="flex items-center">
<div class="w-5 h-2.5 border border-neutral-900 rounded-[3px] p-[1px] flex items-center">
<div class="w-3.5 h-full bg-neutral-900 rounded-[1.5px]"></div>
</div>
<div class="w-0.5 h-1 bg-neutral-900 rounded-r-sm"></div>
</div>
</div>
</div>
<!-- App Header Navigation Bar -->
<div class="flex items-center mt-3 pb-1" data-purpose="app-bar">
<button aria-label="Go Back" class="w-9 h-9 -ml-1.5 flex items-center justify-center text-neutral-800 hover:text-neutral-600 transition-colors active:scale-95" type="button">
<svg class="w-5 h-5 stroke-[2.2] stroke-current" fill="none" viewbox="0 0 24 24">
<path d="M15.75 19.5L8.25 12l7.5-7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<h1 class="text-[19px] font-bold text-neutral-900 tracking-tight ml-2">Add Activity</h1>
</div>
</header>
<!-- END: TopBarSection -->
<!-- BEGIN: FormContentSection -->
<div class="flex-1 overflow-y-auto px-6 py-2" data-purpose="form-container">
<form class="space-y-4" id="add-activity-form" onsubmit="event.preventDefault()">
<!-- Field 1: Activity Name -->
<div class="space-y-1.5" data-purpose="input-group">
<label class="block text-[13px] font-medium text-neutral-600" for="activity-name">
            Activity Name
          </label>
<div class="relative">
<input class="w-full h-12 px-3.5 text-[15px] text-neutral-800 placeholder-neutral-400 bg-white border border-neutral-200 rounded-xl focus:border-brand-teal transition duration-150" id="activity-name" name="activity_name" placeholder="e.g. Uluwatu Temple" type="text"/>
</div>
</div>
<!-- Field 2: Date Picker Input -->
<div class="space-y-1.5" data-purpose="input-group">
<label class="block text-[13px] font-medium text-neutral-600" for="activity-date">
            Date
          </label>
<div class="relative flex items-center">
<input class="w-full h-12 pl-3.5 pr-11 text-[15px] font-normal text-neutral-800 bg-white border border-neutral-200 rounded-xl cursor-pointer focus:border-brand-teal transition duration-150" id="activity-date" name="activity_date" readonly="" type="text" value="12 Apr 2025"/>
<div class="absolute right-3.5 pointer-events-none text-neutral-400">
<svg class="w-5 h-5 stroke-[1.8] stroke-current" fill="none" viewbox="0 0 24 24">
<rect height="18" rx="2" stroke-linecap="round" stroke-linejoin="round" width="18" x="3" y="4"></rect>
<path d="M16 2v4M8 2v4M3 10h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</div>
</div>
<!-- Field 3: Time Input with Clock Icons -->
<div class="space-y-1.5" data-purpose="input-group">
<label class="block text-[13px] font-medium text-neutral-600" for="activity-time">
            Time
          </label>
<div class="relative flex items-center">
<!-- Leading Clock Icon as seen in Screen 6 -->
<div class="absolute left-3.5 pointer-events-none text-neutral-400">
<svg class="w-5 h-5 stroke-[1.8] stroke-current" fill="none" viewbox="0 0 24 24">
<circle cx="12" cy="12" r="9" stroke-linecap="round" stroke-linejoin="round"></circle>
<path d="M12 6v6l4 2" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<input class="w-full h-12 pl-11 pr-11 text-[15px] font-normal text-neutral-800 bg-white border border-neutral-200 rounded-xl cursor-pointer focus:border-brand-teal transition duration-150" id="activity-time" name="activity_time" readonly="" type="text" value="10:00 AM"/>
<!-- Trailing subtle indicator -->
<div class="absolute right-3.5 pointer-events-none text-neutral-400">
<svg class="w-4 h-4 stroke-[2] stroke-current" fill="none" viewbox="0 0 24 24">
<circle cx="12" cy="12" r="9"></circle>
<path d="M12 7v5l3 2" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</div>
</div>
<!-- Field 4: Category Dropdown -->
<div class="space-y-1.5" data-purpose="input-group">
<label class="block text-[13px] font-medium text-neutral-600" for="activity-category">
            Category
          </label>
<div class="relative flex items-center">
<select class="w-full h-12 px-3.5 text-[15px] text-neutral-800 bg-white border border-neutral-200 rounded-xl appearance-none cursor-pointer focus:border-brand-teal transition duration-150" id="activity-category" name="activity_category">
<option selected="" value="Sightseeing">Sightseeing</option>
<option value="Food &amp; Dining">Food &amp; Dining</option>
<option value="Adventure">Adventure</option>
<option value="Culture &amp; Art">Culture &amp; Art</option>
<option value="Relaxation">Relaxation</option>
</select>
<div class="absolute right-3.5 pointer-events-none text-neutral-400">
<svg class="w-4 h-4 stroke-[2] stroke-current" fill="none" viewbox="0 0 24 24">
<path d="M19.5 8.25l-7.5 7.5-7.5-7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</div>
</div>
<!-- Field 5: Location Input -->
<div class="space-y-1.5" data-purpose="input-group">
<label class="block text-[13px] font-medium text-neutral-600" for="activity-location">
            Location
          </label>
<div class="relative flex items-center">
<input class="w-full h-12 pl-3.5 pr-11 text-[15px] text-neutral-800 placeholder-neutral-400 bg-white border border-neutral-200 rounded-xl focus:border-brand-teal transition duration-150" id="activity-location" name="activity_location" placeholder="e.g. Uluwatu, Bali" type="text"/>
<div class="absolute right-3.5 pointer-events-none text-neutral-400">
<!-- Location Pin Icon -->
<svg class="w-5 h-5 stroke-[1.8] stroke-current" fill="none" viewbox="0 0 24 24">
<path d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</div>
</div>
</form>
</div>
<!-- END: FormContentSection -->
<!-- BEGIN: BottomActionSection -->
<footer class="w-full px-6 pt-3 pb-2 flex flex-col items-center" data-purpose="screen-footer">
<!-- Primary Action CTA Button: Save Activity -->
<button class="w-full h-[52px] bg-brand-teal hover:bg-brand-teal-dark active:scale-[0.99] text-white text-[16px] font-semibold tracking-wide rounded-xl shadow-sm transition-all duration-150 flex items-center justify-center cursor-pointer" data-purpose="save-button" form="add-activity-form" type="submit">
        Save Activity
      </button>
<!-- iOS Bottom Home Indicator Bar -->
<div class="w-full pt-4 pb-1 flex justify-center" data-purpose="home-indicator-container">
<div class="w-36 h-1 bg-neutral-900 rounded-full" data-purpose="home-indicator"></div>
</div>
</footer>
<!-- END: BottomActionSection -->
</main>
<!-- END: MobileDeviceFrame -->
</body></html>
