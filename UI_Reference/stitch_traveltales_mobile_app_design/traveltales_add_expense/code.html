<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Add Expense - TravelTales</title>
<!-- Load Tailwind CSS v3 with forms & container queries plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              teal: '#1B4D3E',
              'teal-dark': '#143B2F',
              'teal-light': '#E9F1EF'
            },
            neutral: {
              surface: '#FCFDFD',
              field: '#FFFFFF',
              border: '#E2E8F0',
              label: '#334155',
              subtext: '#94A3B8'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
          }
        }
      }
    };
  </script>
<style data-purpose="custom-styling">
    /* Remove standard browser focus outlines and tune for clean native iOS look */
    input:focus, select:focus, textarea:focus {
      outline: none;
      box-shadow: 0 0 0 1.5px #1B4D3E;
      border-color: #1B4D3E;
    }
    /* Hide native appearance arrows for cross-browser consistency */
    select {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
    }
  </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-0 sm:p-4 text-slate-800 antialiased selection:bg-brand-teal selection:text-white">
<!-- BEGIN: MobileContainer -->
<!-- Designed strictly for Mobile iOS (390 x 844 px portrait viewport) -->
<div class="w-[390px] h-[844px] bg-[#FCFDFD] shadow-2xl relative flex flex-col justify-between overflow-hidden sm:rounded-[44px] border border-gray-200" data-purpose="mobile-viewport">
<!-- Top Container: Status Bar, App Bar & Form Content -->
<div class="flex flex-col flex-1 overflow-y-auto">
<!-- BEGIN: StatusBar -->
<header class="w-full pt-3 px-7 flex justify-between items-center select-none text-slate-900 z-20" data-purpose="ios-status-bar">
<!-- Time -->
<span class="text-[15px] font-semibold tracking-tight">9:41</span>
<!-- Status Icons -->
<div class="flex items-center space-x-1.5">
<!-- Cellular Signal Icon -->
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M2 17h3v4H2v-4zm5-4h3v8H7v-8zm5-4h3v12h-3V9zm5-5h3v17h-3V4z"></path>
</svg>
<!-- Wi-Fi Icon -->
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M12 4c-4.97 0-9.47 2.02-12.73 5.27l1.41 1.41C3.35 7.97 7.42 6.13 12 6.13c4.58 0 8.65 1.84 11.32 4.55l1.41-1.41C21.47 6.02 16.97 4 12 4zm0 4.27c-3.68 0-7.02 1.5-9.43 3.91l1.41 1.41C5.79 11.78 8.74 10.4 12 10.4c3.26 0 6.21 1.38 8.02 3.19l1.41-1.41C19.02 9.77 15.68 8.27 12 8.27zm0 4.27c-2.4 0-4.57.98-6.14 2.55l6.14 6.14 6.14-6.14c-1.57-1.57-3.74-2.55-6.14-2.55z"></path>
</svg>
<!-- Battery Icon -->
<div class="w-6 h-3 border border-slate-900 rounded-sm p-[1px] flex items-center">
<div class="h-full w-full bg-slate-900 rounded-[0.5px]"></div>
</div>
</div>
</header>
<!-- END: StatusBar -->
<!-- BEGIN: AppBar -->
<nav class="w-full px-5 pt-3 pb-3 flex items-center relative" data-purpose="app-bar">
<!-- Back Navigation Button -->
<button aria-label="Go back" class="w-10 h-10 -ml-2 flex items-center justify-center text-slate-800 hover:text-slate-900 active:scale-95 transition-transform" type="button">
<svg class="w-6 h-6 stroke-current stroke-2 fill-none" viewbox="0 0 24 24">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Screen Title -->
<h1 class="text-[19px] font-bold text-slate-900 ml-1 tracking-tight">Add Expense</h1>
</nav>
<!-- END: AppBar -->
<!-- BEGIN: ExpenseForm -->
<main class="px-6 pt-3 flex flex-col gap-5">
<!-- Form Field 1: Category -->
<div class="flex flex-col gap-1.5" data-purpose="form-field-category">
<label class="text-[14px] font-semibold text-slate-700" for="category-select">Category</label>
<div class="relative flex items-center">
<!-- Cutlery / Dining Icon -->
<div class="absolute left-3.5 flex items-center pointer-events-none text-slate-700">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M18 2v6a3 3 0 0 1-3 3 3 3 0 0 1-3-3V2"></path>
<path d="M15 2v18"></path>
<path d="M6 2v8a3 3 0 0 0 6 0V2"></path>
<path d="M9 10v10"></path>
</svg>
</div>
<!-- Category Select Input -->
<select class="w-full h-[50px] pl-10 pr-10 bg-white border border-slate-200 rounded-xl text-[15px] font-medium text-slate-800 transition duration-150 ease-in-out cursor-pointer hover:border-slate-300" id="category-select" name="category">
<option selected="" value="food">Food</option>
<option value="transport">Transport</option>
<option value="hotel">Hotel Stay</option>
<option value="activities">Activities</option>
<option value="flight">Flight Tickets</option>
<option value="other">Other</option>
</select>
<!-- Trailing Chevron Down -->
<div class="absolute right-4 pointer-events-none text-slate-400">
<svg class="w-4 h-4 stroke-current stroke-2 fill-none" viewbox="0 0 24 24">
<path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</div>
</div>
<!-- Form Field 2: Amount -->
<div class="flex flex-col gap-1.5" data-purpose="form-field-amount">
<label class="text-[14px] font-semibold text-slate-700" for="expense-amount">Amount</label>
<div class="relative flex items-center">
<span class="absolute left-4 text-slate-400 font-normal text-[15px] pointer-events-none">₹</span>
<input class="w-full h-[50px] pl-8 pr-4 bg-white border border-slate-200 rounded-xl text-[15px] text-slate-800 placeholder-slate-400 transition duration-150 ease-in-out hover:border-slate-300 font-normal" id="expense-amount" name="amount" placeholder="0.00" type="text"/>
</div>
</div>
<!-- Form Field 3: Date -->
<div class="flex flex-col gap-1.5" data-purpose="form-field-date">
<label class="text-[14px] font-semibold text-slate-700" for="expense-date">Date</label>
<div class="relative flex items-center">
<input class="w-full h-[50px] px-4 pr-11 bg-white border border-slate-200 rounded-xl text-[15px] font-normal text-slate-800 transition duration-150 ease-in-out cursor-pointer hover:border-slate-300" id="expense-date" name="date" readonly="" type="text" value="12 Apr 2025"/>
<!-- Trailing Calendar Icon -->
<div class="absolute right-4 pointer-events-none text-slate-400">
<svg class="w-5 h-5 stroke-current stroke-1.5 fill-none" viewbox="0 0 24 24">
<rect height="18" rx="2" ry="2" stroke-width="2" width="18" x="3" y="4"></rect>
<line stroke-linecap="round" stroke-width="2" x1="16" x2="16" y1="2" y2="6"></line>
<line stroke-linecap="round" stroke-width="2" x1="8" x2="8" y1="2" y2="6"></line>
<line stroke-width="2" x1="3" x2="21" y1="10" y2="10"></line>
</svg>
</div>
</div>
</div>
<!-- Form Field 4: Description -->
<div class="flex flex-col gap-1.5" data-purpose="form-field-description">
<label class="text-[14px] font-semibold text-slate-700" for="expense-description">Description</label>
<input class="w-full h-[50px] px-4 bg-white border border-slate-200 rounded-xl text-[15px] font-normal text-slate-800 placeholder-slate-400 transition duration-150 ease-in-out hover:border-slate-300" id="expense-description" name="description" placeholder="e.g. Dinner at local restaurant" type="text"/>
</div>
</main>
<!-- END: ExpenseForm -->
</div>
<!-- Bottom Actions & Home Indicator -->
<footer class="w-full px-6 pt-2 pb-2 bg-[#FCFDFD] flex flex-col items-center" data-purpose="footer-action">
<!-- Save Expense CTA Button -->
<button class="w-full h-[50px] bg-[#1B4D3E] hover:bg-[#143B2F] active:scale-[0.99] text-white font-medium text-[16px] rounded-xl flex items-center justify-center shadow-sm transition-all duration-150" type="submit">
        Save Expense
      </button>
<!-- BEGIN: HomeIndicator -->
<!-- iOS Home Indicator Bar -->
<div class="w-full pt-4 pb-2 flex justify-center items-center" data-purpose="home-indicator">
<div class="w-[134px] h-[5px] bg-slate-900 rounded-full"></div>
</div>
<!-- END: HomeIndicator -->
</footer>
</div>
<!-- END: MobileContainer -->
</body></html>
