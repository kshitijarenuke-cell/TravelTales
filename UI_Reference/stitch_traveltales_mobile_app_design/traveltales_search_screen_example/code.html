<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              teal: '#1b4d3e',
              tealDark: '#133a2f',
              tealLight: '#2c6b56',
              accent: '#0d9488'
            },
            ios: {
              keyBg: '#FFFFFF',
              keySpecialBg: '#B4B8BF',
              kbBg: '#D1D5DB',
              keyText: '#000000',
              blue: '#007AFF'
            }

              'BlinkMacSystemFont',

<style data-purpose="keyboard-styles">
    /* iOS keyboard key elevation and layout details */
    .ios-key {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 5px;
      font-size: 19px;
      line-height: 1;
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
      user-select: none;
      transition: background-color 0.1s ease;
    }
    .ios-key:active {
      filter: brightness(0.85);
    }
    .ios-special-key {
      background-color: #abb0b8;
      color: #000000;
    }
    /* Custom vertical blinking cursor */
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .blinking-cursor {
      animation: blink 1s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>

<body class="bg-slate-900 min-h-screen flex items-center justify-center p-0 md:p-4 font-sans antialiased text-slate-800 selection:bg-teal-700 selection:text-white">
